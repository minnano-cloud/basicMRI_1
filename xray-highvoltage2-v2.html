<script>
/* ===== 問題データ =====
   q: 問題文 / img: 問題の画像(任意)
   exp: 解答後に表示するまとめの解説(任意)
   choices: t=選択肢の文, img=選択肢の画像, ok=正解ならtrue, fb=選択肢ごとの解説(任意)
   正解(ok:true)を2つ以上にすると「2つ選べ」形式になります。 */
const QUESTIONS = [
  {
    "q": "インバータ式X線高電圧装置で正しいのはどれか。",
    "choices": [
      {
        "t": "インバータ周波数が高いほど電力変換効率は高い。",
        "ok": false,
        "fb": "電力変換→変圧器での一次側から二次側への高電圧化のこと → 高周波ほど損失が大きいため効率は低下する"
      },
      {
        "t": "管電圧のリプルは高電圧ケーブルが長いほど小さい。",
        "ok": true,
        "fb": "正しい。高電圧ケーブルは長いほど静電容量が増大し、リプルを平滑化する。"
      },
      {
        "t": "インバータ周波数が高いほど高電圧変圧器の鉄損が減少する。",
        "ok": false,
        "fb": "周波数が高いほど、鉄損は増大する。"
      },
      {
        "t": "共振形装置はチョッパのパルス幅を変化させて管電圧の調整を行う。",
        "ok": false,
        "fb": "チョッパ回路を用いるのは非共振形（方形波）。"
      },
      {
        "t": "方形波形装置は共振形装置よりもスイッチング時の電力損失が小さい。",
        "ok": false,
        "fb": "インバータ回路におけるスイッチング<br>非共振形：ハードスイッチング ← 良いことではない<br>共振形：ソフトスイッチング"
      }
    ],
    "exp": "高電圧ケーブルには静電容量（約250 pF/m）があり、長いほど容量が増えて管電圧が平滑化され、リプルは小さくなる。ほかの選択肢：周波数が高いほど変換効率は下がり、鉄損は増える／チョッパのパルス幅で調整するのは非共振形／方形波形（ハードスイッチング）は共振形よりスイッチング損失が大きい。"
  },
  {
    "q": "インバータ式X線装置のインバータ周波数を高くしたとき、誤っているのはどれか。",
    "choices": [
      {
        "t": "誘起起電力が高くなる。",
        "ok": false,
        "fb": "下記参照。正しい。<br><a href=\"https://minnano-cloud.github.io/basicMRI_1/images/high-voltage-transformer-emf.png\" target=\"_blank\" rel=\"noopener noreferrer\">高電圧変圧器の起電力の図を見る</a>"
      },
      {
        "t": "高電圧変圧器が小型化できる。",
        "ok": false,
        "fb": "正しい。起電力の式から高周波ほど起電力を大きくできる→鉄心や巻き数を減らせる → 小型化が可能"
      },
      {
        "t": "高電圧変圧器の鉄損が小さくなる。",
        "ok": true,
        "fb": "高周波ほど損失大きい（鉄損など）"
      },
      {
        "t": "管電圧のリプル百分率が小さくなる。",
        "ok": false,
        "fb": "正しい。高周波交流は整流した際にリプルが小さくなる。"
      },
      {
        "t": "電磁エネルギーが発生しやすくなる。",
        "ok": false,
        "fb": "電磁エネルギー（電磁ノイズ）は高周波ほど顕著となる。"
      }
    ],
    "exp": "インバータ周波数を高くすると、誘起起電力が大きくなって変圧器を小型化でき、リプルも小さくなる。一方で、鉄損などの損失と電磁ノイズは増える。「鉄損が小さくなる」が誤り。"
  },
  {
    "q": "容量0.5μFのコンデンサ式X線装置において、充電電圧80 kVで10 mAs放出したときの波尾切断電圧［kV］はどれか。",
    "choices": [
      {
        "t": "50",
        "ok": false
      },
      {
        "t": "60",
        "ok": true,
        "fb": "電圧降下＝mAs/μF<br>電圧降下＝10/0.5=20<br>充電電圧 80-20=60kV"
      },
      {
        "t": "65",
        "ok": false
      },
      {
        "t": "70",
        "ok": false
      },
      {
        "t": "75",
        "ok": false
      }
    ],
    "exp": "コンデンサ式では、放電による電圧降下［kV］＝ 放出したmAs ÷ 容量［μF］。10 ÷ 0.5 ＝ 20 kV 下がるので、波尾切断電圧 ＝ 80 − 20 ＝ 60 kV。"
  },
  {
    "q": "共振形インバータ式X線装置で正しいのはどれか。",
    "choices": [
      {
        "t": "並列共振形は大容量X線装置に適している。",
        "ok": false,
        "fb": "【共振形】<br>直列共振：大容量に適する。負荷抵抗が小さいほど共振現象を起こしやすい。<br>並列共振：大容量は不適。小容量が適する。負荷抵抗が大きいほど共振現象を起こしやすい。"
      },
      {
        "t": "大負荷になるほどインバータ周波数が高くなる。",
        "ok": true,
        "fb": "軽負荷と大負荷で比較した場合：大負荷の方が周波数は高くなる（＋一次電流が連続的となる）"
      },
      {
        "t": "スイッチング時の電力損失は非共振形より大きい。",
        "ok": false
      },
      {
        "t": "直列共振形は負荷抵抗が大きいほど電流の変化が大きい。",
        "ok": false,
        "fb": "直列共振<br>負荷抵抗が小さいほど電流の変化は大きい<br><a href=\"https://minnano-cloud.github.io/basicMRI_1/images/series-resonance-frequency-current.png\" target=\"_blank\" rel=\"noopener noreferrer\">直列共振回路の周波数–電流特性を見る</a>"
      },
      {
        "t": "並列共振形は負荷抵抗が小さいほど共振現象を利用しやすい。",
        "ok": false
      }
    ],
    "exp": "共振形では、負荷が大きく（管電流が大きく）なるほどインバータ周波数を高くして大きな電力を送る。直列共振形は負荷抵抗が小さいほど電流変化が大きく大容量向き、並列共振形は負荷抵抗が大きいほど共振を利用しやすく小容量向き。共振形はソフトスイッチングなので、非共振形よりスイッチング損失が小さい。"
  },
  {
    "q": "短時間負荷が100kV、320mAのとき、X線管入力が30.4kWであった。<br />管電圧のリプル百分率[％]に最も近いのはどれか。",
    "choices": [
      {
        "t": "4",
        "ok": false
      },
      {
        "t": "8",
        "ok": false
      },
      {
        "t": "12",
        "ok": true,
        "fb": "公称最大電力 = 管電圧×管電流×係数f    通常kWで表す。<br>f=1.0（リプル10%以下）<br>f=0.95（リプル10%超〜25%以下）<br>f=0.74（リプル25%超）<br><br>100k × 320m × f =30.4kW<br>30.4/32 = 0.95　よってリプルは10%超〜25%以下となる。"
      },
      {
        "t": "30",
        "ok": false
      },
      {
        "t": "40",
        "ok": false
      }
    ],
    "exp": "X線管入力 ＝ 管電圧 × 管電流 × 係数f。100 kV × 320 mA ＝ 32 kW で、30.4 ÷ 32 ＝ 0.95。f＝0.95はリプル10%超〜25%以下に当たるので、選択肢では12%。"
  },
  {
    "q": "X線高電圧装置について正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "定電圧形のX線の開閉はテトロード管で制御される。",
        "ok": true,
        "fb": "正しい。２次側にテトロード管が配置される。リプルは4%以下。"
      },
      {
        "t": "非共振形インバータ式の管電圧制御はDC-DCコンバータで行われる。",
        "ok": true,
        "fb": "正しい。DC-DCコンバータ（チョッパ回路）のデューティー比を変えることで管電圧を調整。"
      },
      {
        "t": "三相全波整流方式（6ピーク）の管電圧脈動率の理論値は3.4％である。",
        "ok": false,
        "fb": "三相6ピークは13.4%"
      },
      {
        "t": "三相全波整流方式（12ピーク）の高電圧変圧器の二次側はΔ-Δ結線である。",
        "ok": false,
        "fb": "三相12ピーク　一次側 Δ - 二次側 Y-Δ"
      },
      {
        "t": "共振形インバータ式における管電圧のフィードバック制御は、一次側の管電圧を検出して行われる。",
        "ok": false,
        "fb": "インバータ式は二次側に管電圧と管電流を検出する回路がある。これによってフィードバック制御を行う。"
      }
    ],
    "exp": "定電圧形は二次側のテトロード管でX線を開閉する。非共振形インバータ式は、DC-DCコンバータ（チョッパ回路）のデューティ比を変えて管電圧を制御する。三相6ピークのリプル理論値は13.4%（3.4%は12ピーク）、12ピークの変圧器はΔ-Δではない、インバータ式のフィードバックは二次側の管電圧を検出して行う。"
  },
  {
    "q": "共振形インバータ方式の基本原理図を示す。<br />管電圧のフィードバック制御を行う箇所はどれか。",
    "img": "./h5p/高電圧装置2/content/images/inverter-circuit-q7-iGTusr8F-VdDHCLVo.png",
    "choices": [
      {
        "t": "AC-DCコンバータ",
        "ok": false
      },
      {
        "t": "平滑化回路",
        "ok": false
      },
      {
        "t": "インバータ",
        "ok": true,
        "fb": "変圧器の部分が共振回路となっている。抵抗は２次側の全て。共振形はインバータ回路で管電圧を制御する。"
      },
      {
        "t": "共振回路",
        "ok": false
      },
      {
        "t": "整流回路",
        "ok": false
      }
    ],
    "exp": "共振形インバータ式は、インバータ回路の周波数（スイッチング）を変えて管電圧を制御するので、管電圧のフィードバック信号はインバータに送られる。AC-DCコンバータと平滑化回路は直流をつくる部分、整流回路は高電圧を直流に戻す部分で、ここで管電圧を調整するわけではない。"
  },
  {
    "q": "インバータ式X線高電圧装置で誤っているのはどれか。",
    "choices": [
      {
        "t": "インバータ周波数が高いほど電力変換効率は低い。",
        "ok": false,
        "fb": "正しい。電力変換効率と問われたら変圧器での昇圧と考える。よって高周波化は効率が低下する。"
      },
      {
        "t": "電源インピーダンスが高いほど装置の定格出力は小さい。",
        "ok": false,
        "fb": "インピーダンス高い＝定格出力小さい"
      },
      {
        "t": "高電圧ケーブルが長いほど管電圧のリプル百分率は小さい。",
        "ok": false,
        "fb": "高電圧ケーブル長い＝静電容量が増加→リプルの平滑化（リプル小さくなる）"
      },
      {
        "t": "インバータ周波数が高いほど管電圧のリプル百分率は小さい。",
        "ok": false,
        "fb": "高周波ほど整流した後に直流に近づく。"
      },
      {
        "t": "インバータ周波数が高いほど高周波高電圧変圧器の損失は小さい。",
        "ok": true,
        "fb": "高周波ほど変圧器での損失は大きい。"
      }
    ],
    "exp": "インバータ周波数が高いほど、高周波高電圧変圧器の鉄損などの損失は大きくなる。ほかは正しい：周波数が高いほど電力変換効率（電源効率）は低い／電源インピーダンスが高いほど定格出力は小さい／高電圧ケーブルが長いほど静電容量でリプルが小さい／周波数が高いほどリプルは小さい。"
  },
  {
    "q": "インバータ式X線高電圧装置のフィードバック制御について正しいのはどれか。",
    "choices": [
      {
        "t": "制御間隔は1 ms以上である。",
        "ok": false,
        "fb": "インバータのフィードバック制御：数十μsec（マイクロ秒）"
      },
      {
        "t": "管電流に対する制御は行われていない。",
        "ok": false,
        "fb": "管電圧・管電流ともに制御する。"
      },
      {
        "t": "撮影時間を制御して適正線量を調整する。",
        "ok": false,
        "fb": "あまり関係ない設問かと。自動露出制御（AEC）の説明と考えられる。"
      },
      {
        "t": "非共振形〈方形波〉インバータ式装置では周波数を調整する。",
        "ok": false,
        "fb": "非共振（方形波）形はチョッパ回路で制御。"
      },
      {
        "t": "パルス幅変調制御共振形インバータ式装置では位相シフト角を調整する。",
        "ok": true,
        "fb": "正しい。共振形だが、パルス幅変調制御は周波数固定で波の位相を変えることで管電圧制御を行う。よってここにフィードバック信号が送られる。"
      }
    ],
    "exp": "パルス幅変調（PWM）制御の共振形は、周波数を固定したままスイッチングの位相シフト角を変えて管電圧を調整するので、フィードバックで位相シフト角を調整する。フィードバックの間隔は数十μs程度で、管電圧・管電流ともに制御する。非共振形はチョッパ回路で調整し、周波数は変えない。"
  },
  {
    "q": "巻線比n2/n1 = 500の単相2ピーク形X線高電圧装置で、管電流600 mAを流したときの一次電流[A]に最も近いのはどれか。",
    "choices": [
      {
        "t": "250",
        "ok": false
      },
      {
        "t": "280",
        "ok": false
      },
      {
        "t": "300",
        "ok": false
      },
      {
        "t": "330",
        "ok": true,
        "fb": "n2/n1=V2/V1=A1/A2　より<br>n2/n1=500<br>A1/A2=A1/600m×1.1<br>A1=500×600m×1.1=330A"
      },
      {
        "t": "420",
        "ok": false
      }
    ],
    "exp": "変圧器では、電流は巻線比に反比例する（I1 ＝ I2 × n2/n1）。単相2ピーク形では、平均値で表した管電流を実効値に直すため約1.1倍する。I1 ＝ 600 mA × 1.1 × 500 ≒ 330 A。"
  }
];
const PASS = 100;
/* 結果画面の「次の問題に進む」ボタンのリンク先（不要なら null） */
const NEXT_SET = {"url": "./xray-highvoltage3-v2.html", "label": "高電圧装置3"};
const STORAGE_KEY = "quiz-xrayhighvoltage2v2-best";

/* ===== 動作部分（通常は編集不要） ===== */
const $ = id => document.getElementById(id);
let order=[], pos=0, state=[], corder=[], selected=new Set();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getBest(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function setBest(v){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(v));}catch(e){}}
function showBest(el){const b=getBest();el.textContent=b?`これまでの最高記録：${b.score} / ${b.total}問（${b.date}）`:"";}
function choiceHTML(c){return c.img?`<img src="${c.img}" alt="${c.t||"選択肢の画像"}">`:(c.t||"");}
function correctIdx(q){return q.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0);}
function nCorrect(){return state.filter(s=>s&&s.ok).length;}
function nAnswered(){return state.filter(Boolean).length;}

function start(list){
  const base=list||QUESTIONS.map((_,i)=>i);
  order=$("optShuffleQ").checked?shuffle(base):base;
  const sc=$("optShuffleC").checked;
  corder=order.map(qi=>{const ix=QUESTIONS[qi].choices.map((_,i)=>i);return sc?shuffle(ix):ix;});
  state=order.map(()=>null);pos=0;
  $("start").hidden=true;$("result").hidden=true;$("quiz").hidden=false;
  render();window.scrollTo({top:0,behavior:"smooth"});
}

function renderDots(){
  const ul=$("dots");ul.innerHTML="";
  order.forEach((_,i)=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.className="dot"+(state[i]?(state[i].ok?" ok":" ng"):"")+(i===pos?" cur":"");
    b.textContent=i+1;b.title=state[i]?(state[i].ok?"正解":"不正解"):"未回答";
    b.setAttribute("aria-label",`問題${i+1}（${b.title}）`);
    b.addEventListener("click",()=>go(i));
    li.appendChild(b);ul.appendChild(li);
  });
}

function render(){
  const q=QUESTIONS[order[pos]], st=state[pos], multi=correctIdx(q).length>1;
  selected=new Set();
  $("notice").hidden=true;$("navActions").hidden=false;
  $("progText").textContent=`${pos+1} / ${order.length}`;
  $("progBar").style.width=(nAnswered()/order.length*100)+"%";
  $("scoreNow").textContent=`正解 ${nCorrect()}`;
  renderDots();
  $("qnum").textContent=`問題 ${pos+1}`;
  $("qtext").innerHTML=q.q;
  $("multiNote").innerHTML=multi?`<span class="multi-note">${correctIdx(q).length}つ選んでから「解答」を押してください</span>`:"";
  $("qimgWrap").innerHTML=q.img?`<img class="qimg" src="${q.img}" alt="問題の画像（タップで拡大）">`:"";
  const ul=$("choices");ul.innerHTML="";ul.className="choices"+(q.choices.some(c=>c.img)?" imgs":"");
  corder[pos].forEach((orig,n)=>{
    const c=q.choices[orig],li=document.createElement("li"),b=document.createElement("button");
    b.className="choice";b.dataset.orig=orig;
    b.innerHTML=`<span class="no">${n+1}</span><span class="body">${choiceHTML(c)}${c.fb?`<span class="cfb">${c.fb}</span>`:""}</span>`;
    b.addEventListener("click",()=>multi?toggle(orig,b,q):answer(new Set([orig])));
    li.appendChild(b);ul.appendChild(li);
  });
  $("verdict").className="verdict";
  if(st)showAnswered(q,st);
  $("btnPrev").disabled=pos===0;
  $("btnSkip").hidden=!!st;
  $("btnCheck").hidden=!multi||!!st;$("btnCheck").disabled=true;
  $("btnNext").hidden=!st;
  $("btnNext").textContent=pos===order.length-1?"結果を表示":"次へ →";
}

function showAnswered(q,st){
  $("choices").classList.add("answered");
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    const o=Number(b.dataset.orig);
    if(q.choices[o].ok)b.classList.add("correct",...(st.chosen.includes(o)?[]:["missed"]));
    else if(st.chosen.includes(o))b.classList.add("wrong");
  });
  const v=$("verdict");
  v.className="verdict show "+(st.ok?"ok":"ng");
  v.innerHTML=(st.ok?"正解！":"不正解… 緑の枠が正解です。")+(q.exp?`<div class="exp-box">${q.exp}</div>`:"");
}

function toggle(orig,b,q){
  if(selected.has(orig)){selected.delete(orig);b.classList.remove("selected");}
  else{selected.add(orig);b.classList.add("selected");}
  $("btnCheck").disabled=selected.size!==correctIdx(q).length;
}

function answer(chosen){
  const q=QUESTIONS[order[pos]],ans=correctIdx(q);
  const ok=chosen.size===ans.length&&ans.every(i=>chosen.has(i));
  state[pos]={chosen:[...chosen],ok};
  render();
  $("btnNext").focus({preventScroll:true});
}

function go(i){pos=i;render();window.scrollTo({top:0,behavior:"smooth"});}
function next(){
  if(pos<order.length-1){go(pos+1);return;}
  endCheck();
}
function skip(){
  const un=state.map((s,i)=>s?-1:i).filter(i=>i>=0&&i!==pos);
  const after=un.find(i=>i>pos);
  if(pos<order.length-1)go(pos+1);
  else if(un.length)go(after!==undefined?after:un[0]);
  else endCheck();
}
function endCheck(){
  const un=state.filter(s=>!s).length;
  if(!un){finish();return;}
  $("noticeText").textContent=`未回答の問題が ${un} 問あります。未回答の問題は「不正解」として集計されます。`;
  $("notice").hidden=false;$("navActions").hidden=true;
  $("notice").scrollIntoView({behavior:"smooth",block:"center"});
}

function finish(){
  $("quiz").hidden=true;$("result").hidden=false;
  const correct=nCorrect();
  $("scoreBig").innerHTML=`${correct}<small> / ${order.length}問</small>`;
  const full=order.length===QUESTIONS.length,pm=$("passMsg");
  if(full){
    const pass=correct/order.length*100>=PASS;
    pm.className="passmsg "+(pass?"ok":"ng");
    pm.textContent=pass?`目標（${PASS}%）達成！`:`目標（${PASS}%）まであと少し。解説を見直してもう一度挑戦しよう。`;
    const b=getBest();
    if(!b||correct>b.score){const d=new Date();setBest({score:correct,total:order.length,date:`${d.getMonth()+1}/${d.getDate()}`});}
  }else pm.textContent="";
  showBest($("bestResult"));
  $("btnRetryWrong").hidden=!state.some(s=>!s||!s.ok);
  const rv=$("review");rv.innerHTML="";
  order.forEach((qi,n)=>{
    const q=QUESTIONS[qi],st=state[n],ans=correctIdx(q);
    const fmt=list=>list.map(i=>choiceHTML(q.choices[i])).join("、");
    const tag=!st?`<span class="tag na">未回答</span>`:`<span class="tag ${st.ok?"ok":"ng"}">${st.ok?"正解":"不正解"}</span>`;
    const line=!st?`正解：${fmt(ans)}`:st.ok?`正解：${fmt(ans)}`:`あなたの解答：${fmt(st.chosen)} ／ 正解：${fmt(ans)}`;
    let fbs=q.exp?`<p class="exp">${q.exp}</p>`:"";
    q.choices.forEach((c,i)=>{ if(c.fb&&!c.ok&&st&&st.chosen.includes(i)) fbs+=`<p class="exp">✗ ${c.fb}</p>`;
                               if(c.fb&&c.ok&&!q.exp) fbs+=`<p class="exp">✓ ${c.fb}</p>`; });
    const div=document.createElement("div");div.className="review-item";
    div.innerHTML=`<div class="rq">${tag}問題${n+1}　${q.q}</div><div class="ans">${line}</div>${fbs}`;
    rv.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

$("btnStart").addEventListener("click",()=>start());
$("btnCheck").addEventListener("click",()=>answer(selected));
$("btnNext").addEventListener("click",next);
$("btnPrev").addEventListener("click",()=>{if(pos>0)go(pos-1);});
$("btnSkip").addEventListener("click",skip);
$("btnToUnanswered").addEventListener("click",()=>go(state.findIndex(s=>!s)));
$("btnFinishAnyway").addEventListener("click",finish);
$("btnRetryAll").addEventListener("click",()=>start());
$("btnRetryWrong").addEventListener("click",()=>start(order.filter((qi,i)=>!state[i]||!state[i].ok)));
document.addEventListener("click",e=>{
  if(e.target.classList.contains("qimg")){$("zoomImg").src=e.target.src;$("zoom").classList.add("show");}
  else if(e.target.closest("#zoom"))$("zoom").classList.remove("show");
});
showBest($("bestStart"));
if(NEXT_SET){const a=$("btnNextSet");a.href=NEXT_SET.url;a.textContent=`次の問題に進む（${NEXT_SET.label}）→`;a.hidden=false;}
</script>
</body>
</html>

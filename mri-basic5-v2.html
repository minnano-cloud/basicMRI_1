<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MRI基礎5｜磁気共鳴断層画像技術学</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#203047;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,#173b72,#2d67b2);padding:30px 20px;color:#fff}
.wrap{width:min(1000px,calc(100% - 32px));margin:auto}
header .wrap{width:min(1000px,100%)}
h1{margin:5px 0;font-size:clamp(1.6rem,4vw,2.2rem)}
header p{margin:0;font-size:.9rem}
main{padding:24px 0 40px}
.back{display:inline-block;color:#2457a7;font-weight:700;text-decoration:none;margin:0 18px 16px 0}
.back:hover{text-decoration:underline}
a:focus-visible,button:focus-visible{outline:3px solid #2457a7;outline-offset:4px}
.instruction{margin:0 0 18px;color:#526276;font-size:.95rem}
.panel{background:#fff;border:1px solid #dfe7f0;border-radius:16px;padding:24px;margin-bottom:16px}
.panel h2{font-size:1.1rem;margin:0 0 8px}
.scope{margin:0 0 6px;font-weight:700}
.muted{color:#627187;font-size:.9rem}
.options{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:#526276;margin:14px 0 4px}
.options label{display:flex;align-items:center;gap:6px;cursor:pointer}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:.88rem;color:#627187}
.bar{flex:1;height:8px;background:#e4ebf3;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:#2457a7;width:0;transition:width .3s}
.qnum{font-weight:700;color:#2457a7;font-size:.9rem}
.qtext{font-size:1.1rem;font-weight:700;margin:.2em 0 .9em}
.multi-note{display:inline-block;font-size:.8rem;font-weight:700;color:#8a5a00;background:#fff4dc;border-radius:99px;padding:1px 10px;margin-bottom:10px}
.qimg{display:block;max-width:min(100%,420px);height:auto;margin:0 auto 16px;border-radius:10px;cursor:zoom-in}
.choices{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.choices.imgs{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.choice{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid #dfe7f0;border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s;margin:0}
.choice:hover:not(:disabled){border-color:#2457a7;background:#eef4fb}
.choice:disabled{cursor:default}
.choice .no{flex:none;width:26px;height:26px;border-radius:50%;background:#eef4fb;color:#2457a7;display:grid;place-items:center;font-weight:700;font-size:.85rem;margin-top:1px}
.choice .body{flex:1;min-width:0}
.choice img{max-width:100%;height:auto;display:block}
.choices.imgs .choice{flex-direction:column;align-items:center}
.choice.selected{border-color:#2457a7;background:#eef4fb}
.choice.selected .no{background:#2457a7;color:#fff}
.choice.correct{border-color:#1f9d63;background:#e8f7ef}
.choice.correct .no{background:#1f9d63;color:#fff}
.choice.wrong{border-color:#c94040;background:#fdeeee}
.choice.wrong .no{background:#c94040;color:#fff}
.choice.missed{border-style:dashed;border-color:#1f9d63}
.cfb{display:none;margin-top:6px;font-size:.88rem;color:#526276;border-top:1px dashed #d5dee8;padding-top:6px}
.answered .cfb{display:block}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid #dfe7f0;background:#fff;color:#526276;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;padding:0;margin:0}
.dot.ok{background:#1f9d63;border-color:#1f9d63;color:#fff}
.dot.ng{background:#c94040;border-color:#c94040;color:#fff}
.dot.cur{outline:3px solid #2457a7;outline-offset:2px}
.exp-box{font-weight:400;color:#203047;margin-top:6px;line-height:1.75}
.notice{margin-top:16px;border-radius:12px;padding:14px 16px;background:#fff4dc;color:#6b4a00;font-weight:700}
.notice[hidden]{display:none}
.actions .left{margin-right:auto}
.tag.na{background:#eef1f5;color:#627187}
.verdict{display:none;margin-top:16px;border-radius:12px;padding:12px 16px;font-weight:700}
.verdict.show{display:block}
.verdict.ok{background:#e8f7ef;color:#1f7a4f}
.verdict.ng{background:#fdeeee;color:#a12f2f}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid #2457a7;background:#2457a7;color:#fff;border-radius:8px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:#fff;color:#2457a7}
.btn[hidden],.actions[hidden]{display:none}
.next-set{background:#1f9d63;border-color:#1f9d63;text-decoration:none;display:inline-block}
.score{font-size:2.6rem;font-weight:800;color:#2457a7;margin:.1em 0;line-height:1.3}
.score small{font-size:1rem;color:#627187;font-weight:600}
.passmsg{font-weight:700}
.passmsg.ok{color:#1f7a4f}.passmsg.ng{color:#a12f2f}
.review-item{border-top:1px solid #e4ebf3;padding:14px 0}
.review-item:first-of-type{border-top:none}
.rq{font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-right:6px}
.tag.ok{background:#e8f7ef;color:#1f7a4f}.tag.ng{background:#fdeeee;color:#a12f2f}
.ans{font-size:.92rem;margin:.3em 0}
.ans img{height:2.2em;width:auto;vertical-align:middle;margin:0 2px}
.exp{font-size:.88rem;color:#526276;margin:.2em 0 0;padding-left:1em}
.zoom{position:fixed;inset:0;background:rgba(10,20,35,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;cursor:zoom-out}
.zoom.show{display:flex}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
footer{text-align:center;color:#627187;font-size:.8rem;padding:0 16px 24px}
@media(max-width:600px){.panel{padding:16px}}
</style>
</head>
<body>
<header><div class="wrap"><p>磁気共鳴断層画像技術学 ／ 基礎</p><h1>MRI基礎5</h1><p>全10問</p></div></header>
<main class="wrap">
  <nav aria-label="戻る"><a class="back" href="./mri.html">← MRI問題集へもどる</a><a class="back" href="./portal.html">学習ポータルにもどる</a></nav>
  <p class="instruction">各問題に解答して正誤と解説を確認しましょう。正解だと思う選択肢をタップまたはクリックするとすぐに解答が表示されます。「スキップ」で後回しにしたり、上の番号から好きな問題に移動したりできます。最後に合計得点を確認でき、何度でも取り組めます。</p>

  <section class="panel" id="start">
    <p class="scope">スピンエコーと高速スピンエコー / 1.5Tと3.0Tの違い</p>
    <p class="muted">全10問 ／ 目標：100%以上の正解</p>
    
    <div class="options">
      <label><input type="checkbox" id="optShuffleQ" checked> 問題の順番をシャッフル</label>
      <label><input type="checkbox" id="optShuffleC" checked> 選択肢をシャッフル</label>
    </div>
    <p class="muted" id="bestStart"></p>
    <div class="actions"><button class="btn" id="btnStart">開始</button></div>
  </section>

  <section class="panel" id="quiz" hidden>
    <div class="progress"><span id="progText"></span><div class="bar"><span id="progBar"></span></div><span id="scoreNow"></span></div>
    <ul class="dots" id="dots" aria-label="問題一覧（押すとその問題へ移動）"></ul>
    <div class="qnum" id="qnum"></div>
    <div class="qtext" id="qtext"></div>
    <div id="multiNote"></div>
    <div id="qimgWrap"></div>
    <ul class="choices" id="choices"></ul>
    <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
    <div class="notice" id="notice" hidden>
      <div id="noticeText"></div>
      <div class="actions">
        <button class="btn ghost" id="btnToUnanswered">未回答の問題へ</button>
        <button class="btn" id="btnFinishAnyway">このまま結果を表示</button>
      </div>
    </div>
    <div class="actions" id="navActions">
      <button class="btn ghost left" id="btnPrev">← 前へ</button>
      <button class="btn ghost" id="btnSkip" hidden>スキップ</button>
      <button class="btn" id="btnCheck" hidden disabled>解答</button>
      <button class="btn" id="btnNext" hidden>次へ →</button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="panel">
      <h2>結果</h2>
      <div class="score" id="scoreBig"></div>
      <div class="passmsg" id="passMsg"></div>
      <div class="muted" id="bestResult"></div>
      <div class="actions">
        <button class="btn ghost" id="btnRetryWrong">間違えた問題だけ解き直す</button>
        <button class="btn" id="btnRetryAll">もう一度挑戦</button>
        <a class="btn next-set" id="btnNextSet" hidden></a>
      </div>
    </div>
    <div class="panel"><h2>ふりかえり</h2><div id="review"></div></div>
  </section>
</main>
<footer>放射線技術学 学習ポータル</footer>
<div class="zoom" id="zoom"><img alt="拡大画像" id="zoomImg"></div>

<script>
/* ===== 問題データ =====
   q: 問題文 / img: 問題の画像(任意)
   exp: 解答後に表示するまとめの解説(任意)
   choices: t=選択肢の文, img=選択肢の画像, ok=正解ならtrue, fb=選択肢ごとの解説(任意)
   正解(ok:true)を2つ以上にすると「2つ選べ」形式になります。 */
const QUESTIONS = [
  {
    "q": "MRIで正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "T2緩和時間はT2*緩和時間より長い。",
        "ok": true,
        "fb": "緩和時間  T1&gt;T2&gt;T2*"
      },
      {
        "t": "脂肪のT1緩和時間は水のT1緩和時間より長い。",
        "ok": false,
        "fb": "【脂肪】T1が短い代表例（T1WIで高信号）【水】T1, T2ともに長い代表例（T2WIで高信号, T1WIで低信号）"
      },
      {
        "t": "筋肉のT1緩和時間は脂肪のT1緩和時間より短い。",
        "ok": false,
        "fb": "脂肪が短いと考えて良い"
      },
      {
        "t": "ガドリニウム造影剤はT1緩和時間を短縮させる。",
        "ok": true,
        "fb": "ガドリニウム造影剤はT1を短縮させ、腫瘍をT1WIで高信号に描出させる。また濃度が濃い場合にはT2短縮の効果も生じる。"
      },
      {
        "t": "静磁場強度が大きいほどLarmor〈ラーモア〉周波数は低くなる。",
        "ok": false,
        "fb": "ラーモア周波数 = 磁気回転比 × 静磁場強度"
      }
    ],
    "exp": "緩和時間は T1 ＞ T2 ＞ T2* なので、T2はT2*より長い。ガドリニウム造影剤はT1を短縮し、造影された部分をT1強調像で高信号にする（高濃度ではT2も短縮する）。脂肪はT1が短く水はT1が長いので、「脂肪のT1が水より長い」は誤り。筋肉のT1も脂肪より長い。静磁場が強いほどラーモア周波数は高くなる。"
  },
  {
    "q": "1.5T MRIと比較した3T MRIの特徴で正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "SARは減少する。",
        "ok": false,
        "fb": "SARは静磁場強度の２乗に比例するため4倍になる。"
      },
      {
        "t": "SN比は減少する。",
        "ok": false,
        "fb": "SNRは静磁場と比例のため2倍になる。"
      },
      {
        "t": "T1緩和時間は延長する。",
        "ok": true,
        "fb": "T1（縦緩和時間）は延長する。"
      },
      {
        "t": "磁化率アーチファクトは増加する。",
        "ok": true,
        "fb": "磁化率効果の影響をより受けやすくなる。"
      },
      {
        "t": "ケミカルシフトアーチファクトは減少する。",
        "ok": false,
        "fb": "ケミカルシフト（化学シフト）は2倍になる。"
      }
    ],
    "exp": "3 TではT1が延長し、磁化率アーチファクトが増える。SARは静磁場の2乗に比例して約4倍に、SN比は静磁場に比例して約2倍に、ケミカルシフト（Hz）も約2倍になるので、「減少する」の選択肢はすべて誤り。"
  },
  {
    "q": "MRIの高速SE法で数値を大きくすると撮影時間が短縮するのはどれか。",
    "choices": [
      {
        "t": "TE",
        "ok": false,
        "fb": "関係ない"
      },
      {
        "t": "TR",
        "ok": false,
        "fb": "延長させる"
      },
      {
        "t": "加算回数",
        "ok": false,
        "fb": "延長させる"
      },
      {
        "t": "位相エンコード数",
        "ok": false,
        "fb": "延長させる"
      },
      {
        "t": "エコートレイン数",
        "ok": true,
        "fb": "エコートレイン数＝180度パルスの数この数の分だけ時間が短縮される。撮影時間＝TR×位相エンコード数×加算回数 / ETL（エコートレイン数）"
      }
    ],
    "exp": "高速SE法の撮影時間 ＝ TR × 位相エンコード数 × 加算回数 ÷ エコートレイン数（ETL）。分母にあるETLだけが、大きくすると撮影時間が短くなる。TR・位相エンコード数・加算回数は大きくすると延長し、TEは撮影時間にほぼ関係しない。"
  },
  {
    "q": "SE法TR 500 ms、TE 10 msの頭部MR像で最も高信号を呈するのはどれか。",
    "choices": [
      {
        "t": "筋　肉",
        "ok": false,
        "fb": "あらゆる撮影法で等〜低信号となる。"
      },
      {
        "t": "側脳室",
        "ok": false
      },
      {
        "t": "下垂体前葉",
        "ok": false
      },
      {
        "t": "眼窩内脂肪",
        "ok": true,
        "fb": "このTE/TRはT1WIを表す。よって脂肪が最も高信号となる。"
      },
      {
        "t": "脳白質",
        "ok": false
      }
    ],
    "exp": "TR 500 ms・TE 10 msは短TR・短TEのT1強調像。T1が短い脂肪が最も高信号になるので、眼窩内脂肪が正解。脳白質も灰白質よりは明るいが、脂肪には及ばない。側脳室（脳脊髄液）は低信号、筋肉は低〜等信号。"
  },
  {
    "q": "SE法と比較した高速SE法の特徴で正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "撮影時間の延長",
        "ok": false
      },
      {
        "t": "脂肪の低信号化",
        "ok": false,
        "fb": "脂肪は高速スピンエコーとなることで高信号化する。MT効果とJ結合（j-coupling）の影響。"
      },
      {
        "t": "磁化率効果の減少",
        "ok": true,
        "fb": "180度パルスは外磁場の不均一の影響をキャンセルさせる効果がある。"
      },
      {
        "t": "画像の高コントラスト化",
        "ok": false,
        "fb": "複数のTEの取得によりコントラストは低下する。"
      },
      {
        "t": "ブラーリングの発生",
        "ok": true,
        "fb": "ETL数が多いほどブラーリングが顕著となる。画像がボケる。複数TEを取得することが原因。"
      }
    ],
    "exp": "高速SE法は180°パルスを連続して使うので磁化率効果が減る。一方、1回のTRで異なるTEのエコーを集めてk空間を埋めるため、後半のエコーほど信号が減衰していることでブラーリング（ぼけ）が起こり、ETLが大きいほど目立つ。撮影時間は短縮、脂肪は高信号化、コントラストはやや低下する。"
  },
  {
    "q": "MRIの画質について正しいのはどれか。",
    "choices": [
      {
        "t": "信号収集時間は画質とは無関係である。",
        "ok": false,
        "fb": "信号収集をするほどSNRは向上するケースが多い。"
      },
      {
        "t": "SN比はボクセル容積とは無関係である。",
        "ok": false,
        "fb": "ボクセルの大きさが大きいほど内部のプロトン数が多くなるため、SNRが向上する。"
      },
      {
        "t": "静磁場強度が高いほどSN比は高くなる。",
        "ok": true,
        "fb": "静磁場強度とSNRは比例する。"
      },
      {
        "t": "静磁場の均一性は画質とは無関係である。",
        "ok": false,
        "fb": "磁場の均一性が悪いと水のプロトンのピークを正確に捉えられない。また信号ムラなどが生じる。"
      },
      {
        "t": "ハーフフーリエ法を用いるとSN比は高くなる。",
        "ok": false,
        "fb": "k-spaceの半分少々のデータのみ取得する手法のため撮影時間は短くなるが、SNRは低下する。"
      }
    ],
    "exp": "SN比は静磁場強度にほぼ比例する。ほかの選択肢：信号収集時間（加算回数など）を増やすとSN比は上がる／ボクセルが大きいほどプロトンが多くSN比は高い／静磁場が不均一だと信号ムラなどが起こる／ハーフフーリエ法はデータ量を約半分にして時間を短縮する代わりにSN比が下がる。"
  },
  {
    "q": "1.5 TのMRI装置と比較して、3 Tの装置でみられるのはどれか。2つ選べ。ただし、静磁場強度以外の条件は同一とする。",
    "choices": [
      {
        "t": "T1値の延長",
        "ok": true,
        "fb": "正しい。 <a href=\"https://minnano-cloud.github.io/basicMRI_1/images/1.5T3.0T.png\" target=\"_blank\" rel=\"noopener noreferrer\">1.5Tと3.0Tの比較表を見る</a>"
      },
      {
        "t": "T2値の短縮",
        "ok": false,
        "fb": "T2は変わらないかやや短縮する。他に明確な正解があるためここでは不正解とする。"
      },
      {
        "t": "SARの減少",
        "ok": false,
        "fb": "SARは4倍になる。"
      },
      {
        "t": "磁気回転比の増大",
        "ok": false,
        "fb": "磁気回転比は固有の値のため変わらない。"
      },
      {
        "t": "化学シフト［Hz］の増大",
        "ok": true,
        "fb": "化学シフトは2倍になる。"
      }
    ],
    "exp": "3 TではT1が延長し、化学シフト［Hz］は静磁場に比例して約2倍に増える（ppmで表すと変わらない）。T2はほぼ変わらないかやや短縮、SARは約4倍に増え、磁気回転比は核種ごとの定数なので変わらない。"
  },
  {
    "q": "高速SE法によって撮影されたT2強調像について正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "筋肉は高信号である。",
        "ok": false
      },
      {
        "t": "皮下脂肪は高信号である。",
        "ok": true,
        "fb": "高速SE法においては脂肪は高信号化する。"
      },
      {
        "t": "関節の靭帯は高信号である。",
        "ok": false,
        "fb": "靱帯はあらゆる撮影法で低信号"
      },
      {
        "t": "眼球の硝子体は高信号である。",
        "ok": true,
        "fb": "水分に富んでいるため高信号となる"
      },
      {
        "t": "脳の灰白質は白質よりも低信号である。",
        "ok": false,
        "fb": "T2WI、T2 FLAIRは　灰白質 &gt; 白質"
      }
    ],
    "exp": "T2強調像では水分の多い組織（眼球の硝子体、脳脊髄液など）が高信号。さらに高速SE法ではJ結合の影響が打ち消されるため、皮下脂肪もT2強調像で高信号になる。筋肉は低信号、靱帯はどの撮像法でも低信号、脳の灰白質は白質より高信号（T2強調像では灰白質 ＞ 白質）。"
  },
  {
    "q": "MRIの高速SE法において撮影時間が短縮するのはどれか。",
    "choices": [
      {
        "t": "エコー時間の延長",
        "ok": false,
        "fb": "関係ない。"
      },
      {
        "t": "視野サイズの拡大",
        "ok": false,
        "fb": "関係ない。"
      },
      {
        "t": "繰り返し時間の延長",
        "ok": false,
        "fb": "TRのこと。延長させる。"
      },
      {
        "t": "再収束パルス数の増加",
        "ok": true,
        "fb": "再収束パルス（180度パルス）の数 = エコートレインレングス数数が大きいほど時間は短縮される。"
      },
      {
        "t": "位相エンコード数の増加",
        "ok": false,
        "fb": "延長させる。"
      }
    ],
    "exp": "再収束（180°）パルスの数 ＝ エコートレイン数（ETL）。増やすほど1回のTRで集めるデータが増え、撮影時間が短くなる。TR（繰り返し時間）の延長と位相エンコード数の増加は撮影時間を延ばす。TEとFOV（視野）は撮影時間には関係しない。"
  },
  {
    "q": "SE法によってTR400 ms、TE10 msで撮影された頭部MR像について正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "T1強調画像が得られる。",
        "ok": true,
        "fb": "短いTEかつ短いTRなのでT1WIとなる。"
      },
      {
        "t": "T2強調画像が得られる。",
        "ok": false
      },
      {
        "t": "脳槽内は高信号で描出される。",
        "ok": false,
        "fb": "脳槽内には脳脊髄液が存在するためT1WIでは低信号。"
      },
      {
        "t": "下垂体後葉は高信号で描出される。",
        "ok": true,
        "fb": "下垂体後葉はT1WIで高信号となる。"
      },
      {
        "t": "急性期脳梗塞の描出に優れる。",
        "ok": false,
        "fb": "T1WIは急性期脳梗塞では何も変化をきたさない。"
      }
    ],
    "exp": "TR 400 ms・TE 10 msは短TR・短TEでT1強調像。下垂体後葉はT1強調像で高信号に写る。脳槽の中は脳脊髄液なので低信号。急性期脳梗塞はT1強調像では変化がほとんど出ず、検出にはDWIが優れる。"
  }
];
const PASS = 100;
/* 結果画面の「次の問題に進む」ボタンのリンク先（不要なら null） */
const NEXT_SET = {"url": "./mri-quick-quiz1.html", "label": "1問1答 1"};
const STORAGE_KEY = "quiz-mribasic5v2-best";

/* ===== 動作部分（通常は編集不要） ===== */
const $ = id => document.getElementById(id);
let order=[], pos=0, state=[], corder=[], selected=new Set();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getBest(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function setBest(v){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(v));}catch(e){}}
function showBest(el){const b=getBest();el.textContent=b?`これまでの最高記録：${b.score} / ${b.total}問（${b.date}）`:"";}
function choiceHTML(c){return c.img?`<img src="${c.img}" alt="${c.t||"選択肢の画像"}">`:(c.t||"");}
function correctIdx(q){return q.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0);}
function nCorrect(){return state.filter(s=>s&&s.ok).length;}
function nAnswered(){return state.filter(Boolean).length;}

function start(list){
  const base=list||QUESTIONS.map((_,i)=>i);
  order=$("optShuffleQ").checked?shuffle(base):base;
  const sc=$("optShuffleC").checked;
  corder=order.map(qi=>{const ix=QUESTIONS[qi].choices.map((_,i)=>i);return sc?shuffle(ix):ix;});
  state=order.map(()=>null);pos=0;
  $("start").hidden=true;$("result").hidden=true;$("quiz").hidden=false;
  render();window.scrollTo({top:0,behavior:"smooth"});
}

function renderDots(){
  const ul=$("dots");ul.innerHTML="";
  order.forEach((_,i)=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.className="dot"+(state[i]?(state[i].ok?" ok":" ng"):"")+(i===pos?" cur":"");
    b.textContent=i+1;b.title=state[i]?(state[i].ok?"正解":"不正解"):"未回答";
    b.setAttribute("aria-label",`問題${i+1}（${b.title}）`);
    b.addEventListener("click",()=>go(i));
    li.appendChild(b);ul.appendChild(li);
  });
}

function render(){
  const q=QUESTIONS[order[pos]], st=state[pos], multi=correctIdx(q).length>1;
  selected=new Set();
  $("notice").hidden=true;$("navActions").hidden=false;
  $("progText").textContent=`${pos+1} / ${order.length}`;
  $("progBar").style.width=(nAnswered()/order.length*100)+"%";
  $("scoreNow").textContent=`正解 ${nCorrect()}`;
  renderDots();
  $("qnum").textContent=`問題 ${pos+1}`;
  $("qtext").innerHTML=q.q;
  $("multiNote").innerHTML=multi?`<span class="multi-note">${correctIdx(q).length}つ選んでから「解答」を押してください</span>`:"";
  $("qimgWrap").innerHTML=q.img?`<img class="qimg" src="${q.img}" alt="問題の画像（タップで拡大）">`:"";
  const ul=$("choices");ul.innerHTML="";ul.className="choices"+(q.choices.some(c=>c.img)?" imgs":"");
  corder[pos].forEach((orig,n)=>{
    const c=q.choices[orig],li=document.createElement("li"),b=document.createElement("button");
    b.className="choice";b.dataset.orig=orig;
    b.innerHTML=`<span class="no">${n+1}</span><span class="body">${choiceHTML(c)}${c.fb?`<span class="cfb">${c.fb}</span>`:""}</span>`;
    b.addEventListener("click",()=>multi?toggle(orig,b,q):answer(new Set([orig])));
    li.appendChild(b);ul.appendChild(li);
  });
  $("verdict").className="verdict";
  if(st)showAnswered(q,st);
  $("btnPrev").disabled=pos===0;
  $("btnSkip").hidden=!!st;
  $("btnCheck").hidden=!multi||!!st;$("btnCheck").disabled=true;
  $("btnNext").hidden=!st;
  $("btnNext").textContent=pos===order.length-1?"結果を表示":"次へ →";
}

function showAnswered(q,st){
  $("choices").classList.add("answered");
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    const o=Number(b.dataset.orig);
    if(q.choices[o].ok)b.classList.add("correct",...(st.chosen.includes(o)?[]:["missed"]));
    else if(st.chosen.includes(o))b.classList.add("wrong");
  });
  const v=$("verdict");
  v.className="verdict show "+(st.ok?"ok":"ng");
  v.innerHTML=(st.ok?"正解！":"不正解… 緑の枠が正解です。")+(q.exp?`<div class="exp-box">${q.exp}</div>`:"");
}

function toggle(orig,b,q){
  if(selected.has(orig)){selected.delete(orig);b.classList.remove("selected");}
  else{selected.add(orig);b.classList.add("selected");}
  $("btnCheck").disabled=selected.size!==correctIdx(q).length;
}

function answer(chosen){
  const q=QUESTIONS[order[pos]],ans=correctIdx(q);
  const ok=chosen.size===ans.length&&ans.every(i=>chosen.has(i));
  state[pos]={chosen:[...chosen],ok};
  render();
  $("btnNext").focus({preventScroll:true});
}

function go(i){pos=i;render();window.scrollTo({top:0,behavior:"smooth"});}
function next(){
  if(pos<order.length-1){go(pos+1);return;}
  endCheck();
}
function skip(){
  const un=state.map((s,i)=>s?-1:i).filter(i=>i>=0&&i!==pos);
  const after=un.find(i=>i>pos);
  if(pos<order.length-1)go(pos+1);
  else if(un.length)go(after!==undefined?after:un[0]);
  else endCheck();
}
function endCheck(){
  const un=state.filter(s=>!s).length;
  if(!un){finish();return;}
  $("noticeText").textContent=`未回答の問題が ${un} 問あります。未回答の問題は「不正解」として集計されます。`;
  $("notice").hidden=false;$("navActions").hidden=true;
  $("notice").scrollIntoView({behavior:"smooth",block:"center"});
}

function finish(){
  $("quiz").hidden=true;$("result").hidden=false;
  const correct=nCorrect();
  $("scoreBig").innerHTML=`${correct}<small> / ${order.length}問</small>`;
  const full=order.length===QUESTIONS.length,pm=$("passMsg");
  if(full){
    const pass=correct/order.length*100>=PASS;
    pm.className="passmsg "+(pass?"ok":"ng");
    pm.textContent=pass?`目標（${PASS}%）達成！`:`目標（${PASS}%）まであと少し。解説を見直してもう一度挑戦しよう。`;
    const b=getBest();
    if(!b||correct>b.score){const d=new Date();setBest({score:correct,total:order.length,date:`${d.getMonth()+1}/${d.getDate()}`});}
  }else pm.textContent="";
  showBest($("bestResult"));
  $("btnRetryWrong").hidden=!state.some(s=>!s||!s.ok);
  const rv=$("review");rv.innerHTML="";
  order.forEach((qi,n)=>{
    const q=QUESTIONS[qi],st=state[n],ans=correctIdx(q);
    const fmt=list=>list.map(i=>choiceHTML(q.choices[i])).join("、");
    const tag=!st?`<span class="tag na">未回答</span>`:`<span class="tag ${st.ok?"ok":"ng"}">${st.ok?"正解":"不正解"}</span>`;
    const line=!st?`正解：${fmt(ans)}`:st.ok?`正解：${fmt(ans)}`:`あなたの解答：${fmt(st.chosen)} ／ 正解：${fmt(ans)}`;
    let fbs=q.exp?`<p class="exp">${q.exp}</p>`:"";
    q.choices.forEach((c,i)=>{ if(c.fb&&!c.ok&&st&&st.chosen.includes(i)) fbs+=`<p class="exp">✗ ${c.fb}</p>`;
                               if(c.fb&&c.ok&&!q.exp) fbs+=`<p class="exp">✓ ${c.fb}</p>`; });
    const div=document.createElement("div");div.className="review-item";
    div.innerHTML=`<div class="rq">${tag}問題${n+1}　${q.q}</div><div class="ans">${line}</div>${fbs}`;
    rv.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

$("btnStart").addEventListener("click",()=>start());
$("btnCheck").addEventListener("click",()=>answer(selected));
$("btnNext").addEventListener("click",next);
$("btnPrev").addEventListener("click",()=>{if(pos>0)go(pos-1);});
$("btnSkip").addEventListener("click",skip);
$("btnToUnanswered").addEventListener("click",()=>go(state.findIndex(s=>!s)));
$("btnFinishAnyway").addEventListener("click",finish);
$("btnRetryAll").addEventListener("click",()=>start());
$("btnRetryWrong").addEventListener("click",()=>start(order.filter((qi,i)=>!state[i]||!state[i].ok)));
document.addEventListener("click",e=>{
  if(e.target.classList.contains("qimg")){$("zoomImg").src=e.target.src;$("zoom").classList.add("show");}
  else if(e.target.closest("#zoom"))$("zoom").classList.remove("show");
});
showBest($("bestStart"));
if(NEXT_SET){const a=$("btnNextSet");a.href=NEXT_SET.url;a.textContent=`次の問題に進む（${NEXT_SET.label}）→`;a.hidden=false;}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2年向け今期学習範囲｜学習問題</title>
  <style>
    :root { color-scheme: light; --ink:#203047; --muted:#65758b; --line:#dce4ee; --bg:#f4f7fb; --accent:#3267a8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; }
    header { background:linear-gradient(135deg,#315b56,#4a8a7b); color:white; padding:38px 20px 32px; }
    .wrap { max-width:900px; margin:0 auto; }
    .eyebrow { font-size:.88rem; letter-spacing:.08em; opacity:.88; margin:0 0 8px; }
    h1 { font-size:clamp(1.8rem,4vw,2.5rem); margin:0 0 8px; line-height:1.25; }
    header p:last-child { margin:0; opacity:.92; }
    main { max-width:900px; margin:26px auto 40px; padding:0 18px; }
    .intro { margin:0 0 20px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
    .card { background:white; border:1px solid var(--line); border-radius:16px; padding:20px; min-height:150px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 5px 18px rgba(29,52,79,.05); }
    .symbol { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:#e8f3ef; font-size:1.3rem; margin-bottom:12px; }
    h2 { margin:0 0 8px; font-size:1.12rem; }
    .message { margin:0; color:var(--muted); font-size:.93rem; }
    .status { display:inline-block; align-self:flex-start; border-radius:999px; padding:4px 11px; background:#edf1f6; color:#53647a; font-size:.82rem; margin-top:16px; }
    .back { display:inline-block; margin-top:24px; color:var(--accent); text-decoration:none; font-weight:600; }
    .back:hover { text-decoration:underline; }
    footer { text-align:center; color:var(--muted); font-size:.85rem; padding:0 18px 28px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">2年生向け</p>
      <h1>今期学習範囲</h1>
      <p>分野ごとに、授業の進度に合わせて繰り返し学習できる問題を追加します。</p>
    </div>
  </header>
  <main>
    <p class="intro">学習したい分野を確認してください。問題セットは準備できたものから順次追加します。</p>
    <div class="grid">
      <section class="card">
        <div><div class="symbol" aria-hidden="true">☢️</div><h2>放射線治療分野</h2><p class="message">放射線治療に関する練習問題</p></div>
        <span class="status">準備中</span>
      </section>
      <section class="card">
        <div><div class="symbol" aria-hidden="true">⚛️</div><h2>核医学分野</h2><p class="message">核医学に関する練習問題</p></div>
        <span class="status">準備中</span>
      </section>
      <section class="card">
        <div><div class="symbol" aria-hidden="true">🩻</div><h2>X線画像技術・基礎医学分野</h2><p class="message">X線画像技術と基礎医学の練習問題</p></div>
        <span class="status">準備中</span>
      </section>
      <section class="card">
        <div><div class="symbol" aria-hidden="true">🛡️</div><h2>医療安全／放射線安全管理分野</h2><p class="message">医療安全と放射線安全管理に関する練習問題</p></div>
        <span class="status">準備中</span>
      </section>
    </div>
    <a class="back" href="./index.html">← 学習ポータルに戻る</a>
  </main>
  <footer>学習用コンテンツ</footer>
</body>
</html>

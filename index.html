<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRI講義用 基礎1</title>
  <link rel="stylesheet" href="./assets/styles/h5p.css">
</head>
<body>
  <h1>MRI講義用 基礎1</h1>
  <div id="h5p-container">読み込み中...</div>
  <script src="./assets/main.bundle.js"></script>
  <script src="./assets/frame.bundle.js"></script>
  <script>
    (async function () {
      const container = document.getElementById('h5p-container');
      try {
        const h5pPath = './h5p/MR講義用基礎1/';
        const response = await fetch(h5pPath + 'h5p.json');
        if (!response.ok) {
          throw new Error('h5p.json を読み込めませんでした。HTTP ' + response.status);
        }
        if (!window.H5PStandalone || !window.H5PStandalone.H5P) {
          throw new Error('H5P StandaloneプレーヤーのJavaScriptを読み込めませんでした。');
        }
        new H5PStandalone.H5P(container, {
          h5pJsonPath: h5pPath,
          frameJs: './assets/frame.bundle.js',
          frameCss: './assets/styles/h5p.css'
        });
      } catch (error) {
        console.error(error);
        container.innerHTML = `<div style="padding:20px;border:1px solid #cc0000;background:#fff5f5;color:#990000;border-radius:8px;"><strong>H5Pを読み込めませんでした。</strong><br><br>${error.message}</div>`;
      }
    })();
  </script>
</body>
</html>

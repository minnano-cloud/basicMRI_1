<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X線解剖学｜学習問題</title>
  <style>
    :root { color-scheme: light; --ink:#203047; --muted:#65758b; --line:#dce4ee; --bg:#f4f7fb; --accent:#3267a8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
    header { background:linear-gradient(135deg,#254e7b,#397eb2); color:white; padding:38px 20px 32px; }
    .wrap { max-width:900px; margin:0 auto; }
    .eyebrow { font-size:.88rem; letter-spacing:.08em; opacity:.88; margin:0 0 8px; }
    h1 { font-size:clamp(1.8rem,4vw,2.5rem); margin:0 0 8px; line-height:1.25; }
    header p:last-child { margin:0; opacity:.92; }
    main { max-width:900px; margin:26px auto 40px; padding:0 18px; }
    .intro { margin:0 0 20px; color:var(--muted); }
    .section { background:white; border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 5px 18px rgba(29,52,79,.05); }
    h2 { margin:0 0 14px; font-size:1.25rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:12px; }
    .item { border:1px solid var(--line); border-radius:12px; padding:16px; background:#fbfcfe; min-height:112px; display:flex; flex-direction:column; justify-content:space-between; }
    .item strong { font-size:1.05rem; }
    .meta { color:var(--muted); font-size:.9rem; margin-top:5px; }
    .status { display:inline-block; align-self:flex-start; border-radius:999px; padding:3px 10px; background:#edf1f6; color:#53647a; font-size:.82rem; margin-top:12px; }
    .back { display:inline-block; margin-top:22px; color:var(--accent); text-decoration:none; font-weight:600; }
    .back:hover { text-decoration:underline; }
    footer { text-align:center; color:var(--muted); font-size:.85rem; padding:0 18px 28px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">1年生向け・練習問題</p>
      <h1>X線解剖学</h1>
      <p>基礎を確認しながら、繰り返し学習しましょう。</p>
    </div>
  </header>
  <main>
    <p class="intro">学習したい問題セットを選んでください。問題は順次追加予定です。</p>
    <section class="section" aria-labelledby="head-basic">
      <h2 id="head-basic">頭部基礎</h2>
      <div class="grid">
        <div class="item"><div><strong>頭部基礎 1</strong><div class="meta">10問</div></div><span class="status">準備中</span></div>
        <div class="item"><div><strong>頭部基礎 2</strong><div class="meta">10問</div></div><span class="status">準備中</span></div>
        <div class="item"><div><strong>頭部基礎 3</strong><div class="meta">10問</div></div><span class="status">準備中</span></div>
        <div class="item"><div><strong>頭部基礎 4</strong><div class="meta">10問</div></div><span class="status">準備中</span></div>
        <div class="item"><div><strong>頭部基礎 5</strong><div class="meta">10問</div></div><span class="status">準備中</span></div>
      </div>
    </section>
    <a class="back" href="./index.html">← 学習ポータルに戻る</a>
  </main>
  <footer>学習用コンテンツ</footer>
</body>
</html>

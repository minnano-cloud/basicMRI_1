<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X線機器学国試対策｜学習用教材</title>
<style>
:root{color-scheme:light;--ink:#1f2937;--muted:#667085;--line:#e5e7eb;--paper:#fff;--soft:#f8fafc;--accent:#2457a7;--accent-soft:#eef4ff}
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
header{background:linear-gradient(135deg,#173b72,#2d67b2);color:#fff;padding:38px 20px 34px}
.wrap{width:min(960px,100% - 32px);margin:0 auto}
.eyebrow{font-size:.78rem;letter-spacing:.14em;font-weight:700;opacity:.85;margin:0 0 10px}
h1{font-size:clamp(1.6rem,4vw,2.25rem);line-height:1.3;margin:0}
.subtitle{margin:12px 0 0;color:#e7efff}
main{padding:24px 0 48px}
.back{display:inline-block;color:var(--accent);font-weight:650;text-decoration:none;margin:0 0 18px}
.back:hover{text-decoration:underline}
.intro{color:#475467;margin:0 0 26px}
.section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 16px;box-shadow:0 3px 12px rgba(16,24,40,.035)}
.section h2{font-size:1.12rem;margin:0 0 14px}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.set{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-height:94px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none}
.set strong{font-size:1rem}
.detail{font-size:.84rem;color:var(--muted)}
.status{font-size:.76rem;color:#667085;background:#eef0f3;border-radius:999px;padding:2px 8px}
.note{font-size:.9rem;color:var(--muted);margin:24px 2px 0}
footer{padding:20px;text-align:center;color:var(--muted);font-size:.82rem}
@media(max-width:520px){header{padding:30px 16px}.wrap{width:min(100% - 24px,960px)}.section{padding:16px}.sets{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <p class="eyebrow">LEARNING PORTAL / X-RAY EQUIPMENT</p>
    <h1>X線機器学国試対策</h1>
    <p class="subtitle">分野別・国家試験対策問題</p>
  </div>
</header>
<main class="wrap">
  <a class="back" href="./index.html">← 学習ポータルに戻る</a>
  <p class="intro">学習したい分野・問題セットを選んでください。通常の問題セットは10問、国家試験形式は20問を予定しています。新しい問題集は準備ができ次第追加します。</p>
  <div id="sections"></div>
  <p class="note">※ 現在は問題集の準備中です。公開準備ができたセットから順次利用できるようにします。</p>
</main>
<footer>学習用教材｜X線機器学国試対策</footer>
<script>
const groups = [
  { title: "X線管 / 高電圧装置", count: 3, questions: 10 },
  { title: "CR / FPD", count: 2, questions: 10 },
  { title: "透視装置", count: 2, questions: 10 },
  { title: "グリッド / AEC", count: 2, questions: 10 },
  { title: "マンモグラフィ / トモシンセシス", count: 2, questions: 10 },
  { title: "骨密度 / 歯科用装置 / 液晶モニター", count: 2, questions: 10 },
  { title: "X線CT", count: 4, questions: 10 },
  { title: "法令 / JIS", count: 2, questions: 10 },
  { title: "国家試験形式20問", count: 5, questions: 20 }
];
const root = document.getElementById("sections");
groups.forEach(group => {
  const section = document.createElement("section");
  section.className = "section";
  const heading = document.createElement("h2");
  heading.textContent = group.title;
  section.appendChild(heading);
  const sets = document.createElement("div");
  sets.className = "sets";
  for (let i = 1; i <= group.count; i++) {
    const card = document.createElement("div");
    card.className = "set";
    const title = document.createElement("strong");
    title.textContent = group.title === "国家試験形式20問" ? `セット ${i}` : `${group.title} ${i}`;
    const detail = document.createElement("span");
    detail.className = "detail";
    detail.textContent = `${group.questions}問`;
    const status = document.createElement("span");
    status.className = "status";
    status.textContent = "準備中";
    card.append(title, detail, status);
    sets.appendChild(card);
  }
  section.appendChild(sets);
  root.appendChild(section);
});
</script>
</body>
</html>

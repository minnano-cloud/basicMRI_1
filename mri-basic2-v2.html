.score small{font-size:1rem;color:#627187;font-weight:600}

.rq{font-weight:700}

.tag.ok{background:#e8f7ef;color:#1f7a4f}.tag.ng{background:#fdeeee;color:#a12f2f}
.ans{font-size:.92rem;margin:.3em 0}

<body>
<header><div class="wrap"><p>磁気共鳴断層画像技術学 ／ 基礎</p><h1>MRI基礎2<span class="count">全10問</span></h1></div></header>
<main class="wrap">
  <nav aria-label="戻る"><a class="back" href="./mri.html">← MRI問題集へもどる</a><a class="back" href="./portal.html">学習ポータルにもどる</a></nav>
  <p class="instruction">各問題に解答して正誤と解説を確認しましょう。正解だと思う選択肢をタップまたはクリックするとすぐに解答が表示されます。「スキップ」で後回しにしたり、上の番号から好きな問題に移動したりできます。最後に合計得点を確認でき、何度でも取り組めます。</p>

  <section class="panel" id="start">
    <p class="scope">緩和現象 / 装置復習</p>
    <p class="muted">全10問 ／ 目標：全問正解</p>
    
    <div class="options">
      <label><input type="checkbox" id="optShuffleQ" checked> 問題の順番をシャッフル</label>
      <label><input type="checkbox" id="optShuffleC" checked> 選択肢をシャッフル</label>
    </div>
    <p class="muted" id="bestStart"></p>
    <div class="actions"><button class="btn" id="btnStart">開始</button></div>
  </section>

  <section class="panel" id="quiz" hidden>
    <div class="progress"><span id="progText"></span><div class="bar"><span id="progBar"></span></div><span id="scoreNow"></span></div>
    <ul class="dots" id="dots" aria-label="問題一覧（押すとその問題へ移動）"></ul>
    <div class="qnum" id="qnum"></div>
    <div class="qtext" id="qtext"></div>
    <div id="multiNote"></div>
    <div id="qimgWrap"></div>
    <ul class="choices" id="choices"></ul>
    <div class="verdict" id="verdict" role="status" aria-live="polite"></div>
    <div class="notice" id="notice" hidden>
      <div id="noticeText"></div>
      <div class="actions">
        <button class="btn ghost" id="btnToUnanswered">未回答の問題へ</button>
        <button class="btn" id="btnFinishAnyway">このまま結果を表示</button>
      </div>
    </div>
    <div class="actions" id="navActions">
      <button class="btn ghost left" id="btnPrev">← 前へ</button>
      <button class="btn ghost" id="btnSkip" hidden>スキップ</button>
      <button class="btn" id="btnCheck" hidden disabled>解答</button>
      <button class="btn" id="btnNext" hidden>次へ →</button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="panel">
      <h2>結果</h2>
      <div class="score" id="scoreBig"></div>
      <div class="passmsg" id="passMsg"></div>
      <div class="muted" id="bestResult"></div>
      <div class="actions">
        <button class="btn ghost" id="btnRetryWrong">間違えた問題だけ解き直す</button>
        <button class="btn" id="btnRetryAll">もう一度挑戦</button>
        <a class="btn next-set" id="btnNextSet" hidden></a>
      </div>
    </div>
    <div class="panel"><h2>ふりかえり</h2><div id="review"></div></div>
  </section>
</main>
<footer>放射線技術学 学習ポータル</footer>
<div class="zoom" id="zoom"><img alt="拡大画像" id="zoomImg"></div>

<script>
/* ===== 問題データ =====
   q: 問題文 / img: 問題の画像(任意)
   exp: 解答後に表示するまとめの解説(任意)
   choices: t=選択肢の文, img=選択肢の画像, ok=正解ならtrue, fb=選択肢ごとの解説(任意)
   正解(ok:true)を2つ以上にすると「2つ選べ」形式になります。 */
const QUESTIONS = [
  {
    "q": "MRIで正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "歳差運動の位相はラーモア方程式で計算される。",
        "ok": false,
        "fb": "歳差運動の「周波数」がラーモアの式で計算される."
      },
      {
        "t": "RFパルスは歳差運動と異なる周波数である。",
        "ok": false,
        "fb": "RFパルスは装置の磁場強度から求められる共鳴周波数と同じ周波数にする必要がある（共鳴が起こる）"
      },
      {
        "t": "RFパルスは横磁化を減少させる。",
        "ok": false,
        "fb": "主に縦磁化を減少させる."
      },
      {
        "t": "T1は磁場が強いほど長くなる。",
        "ok": true,
        "fb": "【よく出る】　静磁場強度（Tesla）が大きいほど各組織のT1は延長する"
      },
      {
        "t": "T2は横磁化が元の値の 1/e に減少した時間を表す。",
        "ok": true,
        "fb": "1/e=37% , 横磁化が発生時の37%まで減衰する時間を横緩和時間（T2）と呼ぶ."
      }
    ],
    "exp": "正しいのは「T1は静磁場が強いほど長くなる」と「T2は横磁化が元の1/e（約37%）まで減少する時間」。ラーモアの式で求めるのは歳差運動の「周波数」で、位相ではない。RFパルスは共鳴周波数と同じ周波数でないと共鳴が起きない。90°パルスは縦磁化を倒して横磁化をつくる（横磁化を減らすのではない）。"
  },
  {
    "q": "MRIで正しいのはどれか。",
    "choices": [
      {
        "t": "T2緩和時間はT2*緩和時間より短い。",
        "ok": false,
        "fb": "緩和時間の長さ　T1 &gt; T2  &gt; T2*<br>  T2：スピン-スピン相互作用で減衰, T2* : 「スピン- スピン相互作用」＋「外磁場の影響」により減衰,   よってT2&gt;T2*となる."
      },
      {
        "t": "水のT1緩和時間は筋肉のT1緩和時間より長い。",
        "ok": true,
        "fb": "水は生体内では他の組織よりも T1, T2 ともに著しく長い"
      },
      {
        "t": "筋肉のT1緩和時間は脂肪のT1緩和時間より短い。",
        "ok": false,
        "fb": "脂肪はT1が短い組織の代表例としてよく聞かれる. T1が短いとT1WIで高信号となる."
      },
      {
        "t": "ガドリニウム造影剤はT2緩和時間に影響を与えない。",
        "ok": false,
        "fb": "基本的にはT1を短縮させる作用がよく知られているが, 濃度が濃すぎるとT2も短くさせてしまう."
      },
      {
        "t": "静磁場強度が大きいほどLarmor〈ラーモア〉周波数は低くなる。",
        "ok": false,
        "fb": "ラーモアの式 = 磁気回転比 × 静磁場強度（Tesla）より静磁場強度が大きいほどラーモア周波数は高くなる."
      }
    ],
    "exp": "水（自由水）はT1・T2ともに生体内で特に長く、筋肉よりT1が長い。ほかの選択肢：緩和時間は T1 ＞ T2 ＞ T2* なのでT2はT2*より長い／脂肪はT1が短い代表なので、筋肉のT1は脂肪より長い／ガドリニウム造影剤は主にT1を短縮するが、高濃度ではT2も短縮する／静磁場が強いほどラーモア周波数は高くなる。"
  },
  {
    "q": "核磁気共鳴の緩和現象で正しいのはどれか。",
    "choices": [
      {
        "t": "縦緩和時間は磁場均一性に依存する。",
        "ok": false,
        "fb": "横緩和時間は磁場不均一によって減衰が早くなる（T2*の状態に近い, 位相分散が起きやすくなる）. 一方, 縦緩和時間は大きな影響は受けない."
      },
      {
        "t": "縦緩和時間は物質の温度に依存する。",
        "ok": true,
        "fb": "縦緩和時間（T1）は温度や粘稠度の影響を受ける"
      },
      {
        "t": "横緩和時間は縦緩和時間よりも長い。",
        "ok": false,
        "fb": "緩和時間の長さ　T1 &gt; T2 &gt; T2*"
      },
      {
        "t": "横磁化は時間とともに直線的に減少する。",
        "ok": false,
        "fb": "指数関数的な減少となる"
      },
      {
        "t": "縦磁化は90度RFパルス印加中に増加する。",
        "ok": false,
        "fb": "90度パルスにより 縦磁化は減少する, パルスを切ると徐々に回復する"
      }
    ],
    "exp": "縦緩和（T1）は、スピンが周囲の分子（格子）にエネルギーを渡して元に戻る過程（スピン-格子緩和）なので、分子の動きに関わる温度や粘稠度の影響を受ける。ほかの選択肢：磁場の不均一で減衰が速まるのは横磁化（T2*）／T1 ＞ T2 なので横緩和時間のほうが短い／横磁化は指数関数的に減少する／90°パルスの印加中、縦磁化は減少する。"
  },
  {
    "q": "MRIの信号強度で正しいのはどれか。",
    "choices": [
      {
        "t": "心筋はT1強調像で高信号である。",
        "ok": false,
        "fb": "筋肉は通常あらゆる撮影法で低信号を呈する（濃いグレー）"
      },
      {
        "t": "脂肪はT1強調像で低信号である。",
        "ok": false,
        "fb": "脂肪はT1WIで高信号を呈する代表的な組織, 【絶対覚えるところ】"
      },
      {
        "t": "骨皮質はT2強調像で低信号である。",
        "ok": true,
        "fb": "骨皮質はあらゆる撮影法で低信号を呈する（黒）"
      },
      {
        "t": "脳脊髄液はT2強調像で低信号である。",
        "ok": false,
        "fb": "脳脊髄液（CSF）は透明な液体（ほぼ水分）：T1とT2ともに長い, T1WIで低信号（黒）, T2WIで高信号（白）となることがよく知られている. 【これも絶対覚えるところ】"
      },
      {
        "t": "靭帯はプロトン密度像で高信号である。",
        "ok": false,
        "fb": "靱帯はあらゆる撮影法で低信号を呈する（黒）"
      }
    ],
    "exp": "骨皮質は動けるプロトンがほとんどないため、どの撮像法でも低信号（黒）。靱帯・腱も同様に低信号。脂肪はT1強調像で高信号、脳脊髄液はT2強調像で高信号（T1強調像で低信号）、心筋（筋肉）はT1強調像で低〜中等度の信号。"
  },
  {
    "q": "永久磁石のMRI装置の特徴について、超電導磁石のMRI装置と比較した場合に正しいのはどれか。",
    "choices": [
      {
        "t": "磁場強度が高い。",
        "ok": false,
        "fb": "超電導磁石方式の方が高磁場を形成できる"
      },
      {
        "t": "クエンチが発生しない。",
        "ok": true,
        "fb": "液体ヘリウムを使用していないため, クエンチは発生しない. クエンチ＝液体ヘリウムが気化すること"
      },
      {
        "t": "磁場の安定性が優れる。",
        "ok": false,
        "fb": "温度変化の影響を受けるため恒温対策が必要となる"
      },
      {
        "t": "電波シールドが不要である。",
        "ok": false,
        "fb": "外部の電波の受信を避けるためにどの装置でも必ず電波シールドを検査室の壁面に施す."
      },
      {
        "t": "傾斜磁場コイルが不要である。",
        "ok": false,
        "fb": "位置情報付与のために絶対に必要"
      }
    ],
    "exp": "クエンチは超電導コイルが超電導状態を失い、液体ヘリウムが一気に気化する現象。液体ヘリウムを使わない永久磁石方式では起こらない。永久磁石は超電導より低磁場で、温度変化で磁場が変動するため安定性も劣る。電波シールドと傾斜磁場コイルは、どの方式の装置でも必要。"
  },
  {
    "q": "MRI装置で正しいのはどれか。2つ選べ。",
    "choices": [
      {
        "t": "永久磁石は磁気材料の温度依存性が少ない。",
        "ok": false,
        "fb": "温度依存性が高いため恒温対策が必要"
      },
      {
        "t": "永久磁石は超電導磁石に比べ維持費が安い。",
        "ok": true,
        "fb": "超電導磁石方式は検査室以外にコンピュータルームを準備する必要があり, 維持費は高い."
      },
      {
        "t": "超電導磁石の静磁場方向は体軸に平行である。",
        "ok": true,
        "fb": "正しい.  [静磁場の方向] 超電導；体軸方向 / 永久磁石；体軸に垂直"
      },
      {
        "t": "永久磁石は常時液体ヘリウムで冷却する必要がある。",
        "ok": false,
        "fb": "液体ヘリウムを使用するのは「超電導磁石方式」のみ. 近年, 液体ヘリウムを用いない装置も一部メーカーで開発されている."
      },
      {
        "t": "超電導磁石は超電導状態になれば液体ヘリウムは必要ない。",
        "ok": false,
        "fb": "超電導磁石（静磁場コイル）は常時冷却が必要. クライオスタットと呼ばれる槽内に液体ヘリウムに浸された状態で存在する."
      }
    ],

      }
    ],
    "exp": "永久磁石は磁石そのものが磁場をつくるので、静磁場の維持に電力をほとんど使わない（消費電力は小さい）。ほかは正しい記述：永久磁石はオープン型でMRIガイド下のIVRに向く／クエンチでは液体ヘリウムが沸騰・気化する／傾斜磁場の高速な切り替えで渦電流が生じる／シミングは静磁場の均一性を高める調整。"
  },
  {
    "q": "MRI装置で超伝導コイルの最も近くに存在するのはどれか。",
    "choices": [
      {
        "t": "シムコイル",
        "ok": false,
        "fb": "傾斜磁場コイルと静磁場コイルの間に配置される"
      },
      {
        "t": "高周波送信器",
        "ok": false,
        "fb": "RFコイルのこと：一番患者側に配置される"
      },
      {
        "t": "傾斜磁場コイル",
        "ok": false,
        "fb": "RFコイルの外側に配置（x,y,zの３方向分必要）"
      },
      {
        "t": "冷凍機用圧縮機",
        "ok": false
      },
      {

      }
    ],
    "exp": "超電導コイル（静磁場コイル）は、液体ヘリウムを満たしたクライオスタット（断熱容器）の中に入っている。患者側から順に、RFコイル → 傾斜磁場コイル → シムコイル → クライオスタット内の超電導コイル、の並びで覚える。冷凍機用圧縮機は装置の外（機械室）に置かれる。"
  },
  {
    "q": "MRI装置の超伝導磁石で正しいのはどれか。",
    "choices": [
      {

        "ok": false,
        "fb": "オープン型は永久磁石方式, 超電導磁石方式は筒形の形状."
      },
      {
        "t": "コイルの線材は銅である。",
        "ok": false,
        "fb": "【静磁場コイルの素材】永久磁石；ネオジム / 超電導磁石方式：ニオブチタン"
      },

        "t": "冷却に液体ヘリウムを用いる。",
        "ok": true
      },
      {

        "ok": false,
        "fb": "作ることは可能. 現在臨床機で国内で承認されているのは3.0Tまで."
      },
      {
        "t": "電流が流れている間は電力が消費される。",
        "ok": false,
        "fb": "一度、電流を流せば永久に電流は流れているため電力消費は無い."
      }
    ],
    "exp": "超電導磁石は、ニオブチタンの線材を液体ヘリウム（約4 K＝−269℃）で冷やして電気抵抗ゼロの状態にする。いったん電流を流せば流れ続けるので、静磁場の維持に電力は使わない。形状は筒形（トンネル型）で、オープン型は主に永久磁石。3 Tを超える装置も製作でき、研究用などに使われている。"
  },
  {
    "q": "MRIの撮影中に検査室内に発生する規則的な音の原因で考えられるのはどれか。",
    "choices": [
      {
        "t": "静磁場の回転",
        "ok": false
      },
      {
        "t": "クエンチの発生",
        "ok": false
      },
      {

        "ok": true,
        "fb": "騒音の原因となる（フレミング左手の法則に従いローレンツ力が傾斜磁場に発生する）"
      },
      {
        "t": "電源装置の振動",
        "ok": false
      },
      {
        "t": "RFパルスの印加",
        "ok": false
      }
    ],
    "exp": "撮像中の規則的な「ガンガン」という音は、傾斜磁場コイルに速く切り替わる電流が流れ、静磁場の中でローレンツ力を受けて振動するために出る。撮像シーケンスに合わせて規則的に鳴るのが特徴。静磁場は回転せず、クエンチは異常事態、RFパルスは騒音の主な原因ではない。"
  }

const PASS = 100;
/* 結果画面の「次の問題に進む」ボタンのリンク先（不要なら null） */
const NEXT_SET = {"url": "./mri-basic3-v2.html", "label": "MRI基礎3"};
const STORAGE_KEY = "quiz-mribasic2v2-best";

/* ===== 動作部分（通常は編集不要） ===== */
const $ = id => document.getElementById(id);
let order=[], pos=0, state=[], corder=[], selected=new Set();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getBest(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function setBest(v){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(v));}catch(e){}}
function showBest(el){const b=getBest();el.textContent=b?`これまでの最高記録：${b.score} / ${b.total}問（${b.date}）`:"";}
function choiceHTML(c){return c.img?`<img src="${c.img}" alt="${c.t||"選択肢の画像"}">`:(c.t||"");}
function correctIdx(q){return q.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0);}
function nCorrect(){return state.filter(s=>s&&s.ok).length;}
function nAnswered(){return state.filter(Boolean).length;}

function start(list){
  const base=list||QUESTIONS.map((_,i)=>i);
  order=$("optShuffleQ").checked?shuffle(base):base;
  const sc=$("optShuffleC").checked;
  corder=order.map(qi=>{const ix=QUESTIONS[qi].choices.map((_,i)=>i);return sc?shuffle(ix):ix;});
  state=order.map(()=>null);pos=0;
  $("start").hidden=true;$("result").hidden=true;$("quiz").hidden=false;
  render();toQuizTop();
}

function renderDots(){
  const ul=$("dots");ul.innerHTML="";
  order.forEach((_,i)=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.className="dot"+(state[i]?(state[i].ok?" ok":" ng"):"")+(i===pos?" cur":"");
    b.textContent=i+1;b.title=state[i]?(state[i].ok?"正解":"不正解"):"未回答";
    b.setAttribute("aria-label",`問題${i+1}（${b.title}）`);
    b.addEventListener("click",()=>go(i));
    li.appendChild(b);ul.appendChild(li);
  });
}

function render(){
  const q=QUESTIONS[order[pos]], st=state[pos], multi=correctIdx(q).length>1;
  selected=new Set();
  $("notice").hidden=true;$("navActions").hidden=false;
  $("progText").textContent=`${pos+1} / ${order.length}`;
  $("progBar").style.width=(nAnswered()/order.length*100)+"%";
  $("scoreNow").textContent=`正解 ${nCorrect()}`;
  renderDots();
  $("qnum").textContent=`問題 ${pos+1}`;
  $("qtext").innerHTML=q.q;
  $("multiNote").innerHTML=multi?`<span class="multi-note">${correctIdx(q).length}つ選んでから「解答」を押してください</span>`:"";
  $("qimgWrap").innerHTML=q.img?`<img class="qimg" src="${q.img}" alt="問題の画像（タップで拡大）">`:"";
  const ul=$("choices");ul.innerHTML="";ul.className="choices"+(q.choices.some(c=>c.img)?" imgs":"");
  corder[pos].forEach((orig,n)=>{
    const c=q.choices[orig],li=document.createElement("li"),b=document.createElement("button");
    b.className="choice";b.dataset.orig=orig;
    b.innerHTML=`<span class="no">${n+1}</span><span class="body">${choiceHTML(c)}${c.fb?`<span class="cfb">${c.fb}</span>`:""}</span>`;
    b.addEventListener("click",()=>multi?toggle(orig,b,q):answer(new Set([orig])));
    li.appendChild(b);ul.appendChild(li);
  });
  $("verdict").className="verdict";
  if(st)showAnswered(q,st);
  $("btnPrev").disabled=pos===0;
  $("btnSkip").hidden=!!st;
  $("btnCheck").hidden=!multi||!!st;$("btnCheck").disabled=true;
  $("btnNext").hidden=!st;
  $("btnNext").textContent=pos===order.length-1?"結果を表示":"次へ →";
}

function showAnswered(q,st){
  $("choices").classList.add("answered");
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    const o=Number(b.dataset.orig);
    if(q.choices[o].ok)b.classList.add("correct",...(st.chosen.includes(o)?[]:["missed"]));
    else if(st.chosen.includes(o))b.classList.add("wrong");
  });
  const v=$("verdict");
  v.className="verdict show "+(st.ok?"ok":"ng");
  v.innerHTML=(st.ok?"正解！":"不正解… 緑の枠が正解です。")+(q.exp?`<div class="exp-box">${q.exp}</div>`:"");
}

function toggle(orig,b,q){
  if(selected.has(orig)){selected.delete(orig);b.classList.remove("selected");}
  else{selected.add(orig);b.classList.add("selected");}
  $("btnCheck").disabled=selected.size!==correctIdx(q).length;
}

function answer(chosen){
  const q=QUESTIONS[order[pos]],ans=correctIdx(q);
  const ok=chosen.size===ans.length&&ans.every(i=>chosen.has(i));
  state[pos]={chosen:[...chosen],ok};
  render();
  $("btnNext").focus({preventScroll:true});
}

function toQuizTop(){$("quiz").scrollIntoView({behavior:"smooth",block:"start"});}
function go(i){pos=i;render();toQuizTop();}
function next(){
  if(pos<order.length-1){go(pos+1);return;}
  endCheck();
}
function skip(){
  const un=state.map((s,i)=>s?-1:i).filter(i=>i>=0&&i!==pos);
  const after=un.find(i=>i>pos);
  if(pos<order.length-1)go(pos+1);
  else if(un.length)go(after!==undefined?after:un[0]);
  else endCheck();
}
function endCheck(){
  const un=state.filter(s=>!s).length;
  if(!un){finish();return;}
  $("noticeText").textContent=`未回答の問題が ${un} 問あります。未回答の問題は「不正解」として集計されます。`;
  $("notice").hidden=false;$("navActions").hidden=true;
  $("notice").scrollIntoView({behavior:"smooth",block:"center"});
}

function finish(){
  $("quiz").hidden=true;$("result").hidden=false;
  const correct=nCorrect();
  $("scoreBig").innerHTML=`${correct}<small> / ${order.length}問</small>`;
  const full=order.length===QUESTIONS.length,pm=$("passMsg");
  if(full){
    const pass=correct/order.length*100>=PASS;
    pm.className="passmsg "+(pass?"ok":"ng");
    pm.textContent=pass?`目標（${PASS}%）達成！`:`目標（${PASS}%）まであと少し。解説を見直してもう一度挑戦しよう。`;
    const b=getBest();
    if(!b||correct>b.score){const d=new Date();setBest({score:correct,total:order.length,date:`${d.getMonth()+1}/${d.getDate()}`});}
  }else pm.textContent="";
  showBest($("bestResult"));
  $("btnRetryWrong").hidden=!state.some(s=>!s||!s.ok);
  const rv=$("review");rv.innerHTML="";
  order.forEach((qi,n)=>{
    const q=QUESTIONS[qi],st=state[n],ans=correctIdx(q);
    const fmt=list=>list.map(i=>choiceHTML(q.choices[i])).join("、");
    const tag=!st?`<span class="tag na">未回答</span>`:`<span class="tag ${st.ok?"ok":"ng"}">${st.ok?"正解":"不正解"}</span>`;
    const line=!st?`正解：${fmt(ans)}`:st.ok?`正解：${fmt(ans)}`:`あなたの解答：${fmt(st.chosen)} ／ 正解：${fmt(ans)}`;
    let fbs=q.exp?`<p class="exp">${q.exp}</p>`:"";
    q.choices.forEach((c,i)=>{ if(c.fb&&!c.ok&&st&&st.chosen.includes(i)) fbs+=`<p class="exp">✗ ${c.fb}</p>`;
                               if(c.fb&&c.ok&&!q.exp) fbs+=`<p class="exp">✓ ${c.fb}</p>`; });
    const div=document.createElement("div");div.className="review-item";
    div.innerHTML=`<div class="rq">${tag}問題${n+1}　${q.q}</div><div class="ans">${line}</div>${fbs}`;
    rv.appendChild(div);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

$("btnStart").addEventListener("click",()=>start());
$("btnCheck").addEventListener("click",()=>answer(selected));
$("btnNext").addEventListener("click",next);
$("btnPrev").addEventListener("click",()=>{if(pos>0)go(pos-1);});
$("btnSkip").addEventListener("click",skip);
$("btnToUnanswered").addEventListener("click",()=>go(state.findIndex(s=>!s)));
$("btnFinishAnyway").addEventListener("click",finish);
$("btnRetryAll").addEventListener("click",()=>start());
$("btnRetryWrong").addEventListener("click",()=>start(order.filter((qi,i)=>!state[i]||!state[i].ok)));
document.addEventListener("click",e=>{
  if(e.target.classList.contains("qimg")){$("zoomImg").src=e.target.src;$("zoom").classList.add("show");}
  else if(e.target.closest("#zoom"))$("zoom").classList.remove("show");
});
showBest($("bestStart"));
if(NEXT_SET){const a=$("btnNextSet");a.href=NEXT_SET.url;a.textContent=`次の問題に進む（${NEXT_SET.label}）→`;a.hidden=false;}
</script>
</body>
</html>
